# Cloud Build pipeline for the Deploy-YNAB-MCP trigger (push to master).
# The trigger runs as a user-specified service account, which requires an
# explicit logging option; autodetected Dockerfile builds don't set one.
options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: us-central1
  _SERVICE: ynab-mcp
  _IMAGE: us-central1-docker.pkg.dev/ynab-mcp-503313/cloud-run-source-deploy/ynab-mcp

steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}:${COMMIT_SHA}", "-t", "${_IMAGE}:latest", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_IMAGE}"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${COMMIT_SHA}
      - --region=${_REGION}
      # Stateless request/response MCP; one instance is plenty and the 2026-08-30
      # idle-SSE incident is why maxScale must never be left unset.
      - --max-instances=1

images:
  - ${_IMAGE}:${COMMIT_SHA}
  - ${_IMAGE}:latest
