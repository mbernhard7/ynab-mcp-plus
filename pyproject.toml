[project]
name = "ynab-mcp-plus"
version = "0.3.0"
description = "MCP server for YNAB with OAuth 'Sign in with YNAB', self-hostable"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Miles Bernhard", email = "bernhard.miles@gmail.com" }
]
keywords = ["ynab", "mcp", "budget", "finance", "oauth", "agentic", "LLM", "AI"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mcp>=1.28.0",
    "ynab==4.3.0",
    "pydantic",
    "pydantic-settings",
    "uvicorn",
    "httpx",
    "cryptography",
]

[project.urls]
Homepage = "https://github.com/mbernhard7/ynab-mcp-plus"
Repository = "https://github.com/mbernhard7/ynab-mcp-plus"
Issues = "https://github.com/mbernhard7/ynab-mcp-plus/issues"

[project.scripts]
ynab-mcp-server = "ynab_mcp_server:main"
ynab-mcp-server-http = "ynab_mcp_server.http_app:main"
ynab-mcp-gen-secret = "ynab_mcp_server.gen_secret:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-v --cov=ynab_mcp_server --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["ynab_mcp_server"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
]
# Line length is enforced for code by the formatter; E501 only fights long
# string literals (tool descriptions), so leave it to the formatter.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/ynab_mcp_server"]
